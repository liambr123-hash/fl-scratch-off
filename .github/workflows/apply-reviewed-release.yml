# Temporary owner-dispatched import of a reviewed release. Remove this workflow
# through the signed-in owner UI after a successful import; this job never edits
# any .github/workflows path and never creates a new credential.
name: Apply reviewed scratch-off release (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: write

# Share the existing data-refresh lock so the two jobs do not write concurrently.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  apply-reviewed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # SHA-256 of the exact reviewed code-only .codex-release.patch upload.
      # A changed payload must be reviewed and this fixed digest updated before dispatch.
      PATCH_SHA256: 6a1c32a2ff38f42752ecf50d6df48de1f7b268e2d83173ba13ab277a59426707
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1

      - name: Validate and stage the reviewed binary patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"
          test -f .codex-release.patch
          if [[ ! "$PATCH_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'The reviewed patch SHA-256 has not been configured.' >&2
            exit 1
          fi
          printf '%s  %s\n' "$PATCH_SHA256" '.codex-release.patch' | sha256sum --check --strict -
          printf 'RELEASE_BASE=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # The owner has already uploaded the final refresh.yml through the UI.
          # GITHUB_TOKEN has no Workflows write permission, so exclude that path.
          git apply --check --index --exclude=.github/workflows/refresh.yml .codex-release.patch
          git apply --index --exclude=.github/workflows/refresh.yml .codex-release.patch
          git rm -- .codex-release.patch
          if test -n "$(git diff --cached --name-only -- .github/workflows/)"; then
            echo 'Refusing an import that changes a workflow path.' >&2
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install the reviewed pipeline requirements
        run: python -m pip install -r pipeline/requirements.txt

      - name: Rebuild the homepage, search pages and social cards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          raw = Path('public/data.js').read_text(encoding='utf-8').strip()
          data = json.loads(raw.removeprefix('const DATA=').removesuffix(';'))
          meta = data.get('meta', {})
          history = Path('public/history.json')
          provenance = {
              'built': meta.get('built'),
              'built_at': meta.get('built_at'),
              'history_sha256': hashlib.sha256(history.read_bytes()).hexdigest(),
          }
          assert provenance['built'] and provenance['built_at'], 'Missing source snapshot timestamps'
          target = Path(os.environ['RUNNER_TEMP']) / 'flscratchstats-source-provenance.json'
          target.write_text(json.dumps(provenance), encoding='utf-8')
          PYCODE
          python pipeline/build_site.py
          python - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          target = Path(os.environ['RUNNER_TEMP']) / 'flscratchstats-source-provenance.json'
          before = json.loads(target.read_text(encoding='utf-8'))
          raw = Path('public/data.js').read_text(encoding='utf-8').strip()
          data = json.loads(raw.removeprefix('const DATA=').removesuffix(';'))
          meta = data.get('meta', {})
          after = {
              'built': meta.get('built'),
              'built_at': meta.get('built_at'),
              'history_sha256': hashlib.sha256(Path('public/history.json').read_bytes()).hexdigest(),
          }
          assert after == before, 'Rebuild changed source timestamps or historical claim data'
          for game in data['games']:
              assert (Path('public/og') / (str(game['game_no']) + '.png')).is_file(), 'Missing PNG social card'
          print('Source timestamps and history unchanged; all current games have PNG cards.')
          PYCODE
          git add -A public

      - name: Test source quality, snapshot repair and discovery preservation
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test the private inquiry API and frontend syntax
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          node --check public/assets/site.js

      - name: Commit the complete release and push main atomically
        shell: bash
        run: |
          set -euo pipefail
          # Tests must not silently alter the staged, reviewed release outputs.
          git diff --exit-code
          if test -n "$(git diff --cached --name-only -- .github/workflows/)"; then
            echo 'Refusing to commit a workflow-path modification.' >&2
            exit 1
          fi
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'data-refresh-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Publish reviewed scratch-off explorer and private sponsorships'
          git fetch --no-tags origin main
          if test "$(git rev-parse origin/main)" != "$RELEASE_BASE"; then
            echo 'Main changed during validation. No push was attempted; review the new source before rerunning.' >&2
            exit 1
          fi
          # No force push or automatic conflict resolution. A race is rejected.
          git push origin HEAD:refs/heads/main
          printf 'Imported release commit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf 'The patch upload was removed. The temporary workflow is unchanged and must be removed through the owner UI.\n' >> "$GITHUB_STEP_SUMMARY"
