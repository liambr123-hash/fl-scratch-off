name: Nightly data refresh

on:
  # Historical FL Lottery overnight updates finish around 6:20am Eastern. GitHub cron is UTC:
  # 12:07 is 7:07am EST / 8:07am EDT, after that window in both seasons. The later run is a
  # second refresh opportunity if the first is delayed or a source is temporarily unavailable.
  # GitHub may delay scheduled dispatch; the website displays the actual source build timestamp.
  schedule:
    - cron: "7 12 * * *"    # 7:07am EST / 8:07am EDT
    - cron: "47 16 * * *"   # 11:47am EST / 12:47pm EDT safety net
  workflow_dispatch: {}      # lets you run it manually from the Actions tab

permissions:
  contents: write            # allow the bot to commit all generated public data and pages

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Rebuild data from the Florida Lottery API
        run: python3 pipeline/refresh.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit updated data
        run: |
          git config user.name  "data-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A public pipeline/pdfcache   # data/history, homepage/assets, JSON/CSV exports, game/search pages, cards, sitemap/robots, PDF cache
          if git diff --staged --quiet; then
            echo "No data changes today."
          else
            git commit -m "data: nightly refresh ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin main
            git push
          fi
